<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){var t='dark';try{if(localStorage.getItem('venn-board-theme')==='light')t='light';}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A growing Venn diagram for planning a graduation project. Boards save in your own browser.">
<title>Venn board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --dot:#232323; --surface:#111111; --surface-2:#191919; --line:#2a2a2a;
  --text:#f2f2f2; --muted:#9b9b9b; --audience:#3BB4E5; --product:#76BC20; --process:#B79CFF;
  --overlap:#d9d9d9; --impact:#EE7622; --danger:#ff6b5b;
  --chip-bg:#050505; --field:#000000; --hover-line:#5a5a5a; --backdrop:rgba(0,0,0,.72);
  --field-line:#767676; --on-impact:#000000;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; --text:#f2f2f2; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#000000; --text:#f2f2f2; color-scheme:dark; }
:root[data-theme="light"]{
  --bg:#f7f6f3; --dot:#d6d3cc; --surface:#ffffff; --surface-2:#f2f1ee; --line:#e2dfd8;
  --text:#161616; --muted:#5a5a5a; --audience:#13719D; --product:#41780C; --process:#6E4FD8;
  --overlap:#3d3d3d; --impact:#AB500D; --danger:#b3301c;
  --chip-bg:#ffffff; --field:#ffffff; --hover-line:#9c968a; --backdrop:rgba(20,20,20,.35);
  --field-line:#837e74; --on-impact:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.5px);
  background-size:24px 24px;
  color:var(--text);
  font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.5; min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--impact);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px}
.top .title{font-size:21px;margin-right:auto}
.top .tools{margin-left:auto}
.title{flex:0 1 auto;min-width:0;max-width:100%;background:none;border:0;border-bottom:1px dashed var(--field-line);font-size:24px;font-weight:600;letter-spacing:-.01em;padding:4px 0}
.title:hover,.title:focus{border-bottom-color:var(--line);outline:none}
.status{color:var(--muted);font-size:13px}
@media (max-width:600px){ .title{font-size:20px} }
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{font-size:14px;padding:8px 14px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--hover-line)}
.btn.primary{background:var(--impact);border-color:var(--impact);color:var(--on-impact);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{background:none;color:var(--danger);border-color:transparent;padding-left:0}
.btn:disabled{opacity:.5;cursor:default}

/* Layout */
:root{--panel-w:420px;--gap:12px}
.glass{background:color-mix(in srgb, var(--surface) 74%, transparent);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);border:1px solid var(--line);border-radius:14px}
.bgdeco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgdeco svg{width:100%;height:100%;display:block}
.bgdeco circle{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke}
:root[data-theme="light"] .bgdeco circle{stroke-width:2}
.canvas{position:fixed;inset:0;z-index:1;overflow:hidden;touch-action:none;cursor:grab;outline:none;user-select:none;-webkit-user-select:none}
.canvas.panning{cursor:grabbing}
.canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--impact)}
.stage{position:absolute;left:0;top:0;width:var(--sw,600px);height:var(--sw,600px);transform-origin:0 0;will-change:transform}
header.top{position:fixed;z-index:6;top:calc(var(--gap) + env(safe-area-inset-top,0px));left:var(--gap);right:calc(var(--panel-w) + var(--gap) * 2)}
.panel{position:fixed;z-index:6;top:calc(var(--gap) + env(safe-area-inset-top,0px));right:var(--gap);bottom:calc(var(--gap) + env(safe-area-inset-bottom,0px));width:var(--panel-w);overflow:auto;overscroll-behavior:contain}
.zoombar{position:absolute;z-index:4;left:var(--gap);bottom:calc(var(--gap) + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:6px;cursor:default}
.zoombar .zlevel{min-width:3.6em;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.zoombar .zhint{font-size:13px;color:var(--muted);padding:0 8px 0 4px}
@media (min-width:921px){ html,body{height:100%;overflow:hidden} }
@media (max-width:920px){
  header.top{position:static;margin:var(--gap)}
  .canvas{position:relative;height:64vh;min-height:340px;margin:0 var(--gap);border:1px solid var(--line);border-radius:14px}
  .panel{position:static;width:auto;margin:var(--gap);overflow:visible}
  .zoombar .zhint{display:none}
}

/* Diagram */
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{fill-opacity:.07;stroke-width:1.6;transition:cx .5s ease,cy .5s ease,r .5s ease}
.overlay-layer{position:absolute;inset:0;contain:layout style}
.zhead,.chip,.more{position:absolute;transform:translate(-50%,-50%);white-space:nowrap}
.zhead{display:flex;align-items:center;gap:.4em;background:color-mix(in srgb, var(--bg) 86%, transparent);border:0;border-radius:999px;padding:.35em .6em;min-height:28px;cursor:pointer;font-weight:600;font-size:calc(var(--fs,14px) * 1.12);color:var(--zc)}
.zhead .count{font-weight:500;color:var(--muted);font-size:.85em}
.zhead .plus{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;border:1px solid currentColor;font-size:.85em;line-height:1;opacity:.75}
.zhead:hover .plus{opacity:1;background:var(--zc);color:var(--bg)}
.chip{max-width:var(--w);overflow:hidden;text-overflow:ellipsis;padding:.32em .85em;border-radius:999px;background:var(--chip-bg);border:1px solid var(--zc);font-size:var(--fs,14px);font-weight:500;cursor:pointer;line-height:1.3;min-height:24px}
.chip::before{content:'';position:absolute;inset:-6px}
.chip{transition:transform .14s ease,box-shadow .14s ease}
.chip:hover,.chip:focus-visible{background:var(--surface-2);transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 0 3px color-mix(in srgb, var(--zc) 35%, transparent),0 6px 16px rgba(0,0,0,.3);z-index:3}
.chip.untitled{color:var(--muted);font-style:italic}
.zhead .hidden{font-weight:500;color:var(--muted);font-size:.8em;text-decoration:underline;text-underline-offset:2px}
@media (max-width:700px){ .chip{padding:.28em .65em} }
.compact .zhead .count,.compact .zhead .hidden{display:none}
.compact .zhead{display:block;white-space:normal;max-width:34%;text-align:center;line-height:1.2;border-radius:12px}
.compact .zhead .plus{display:inline;width:auto;height:auto;padding:0 .3em;margin-left:.3em;border-radius:999px}
.compact .zhead .nw{white-space:nowrap}
.xcard{position:absolute;transform:translate(-50%,-50%);width:var(--w);text-align:left;background:var(--chip-bg);border:1px solid var(--zc);border-left:6px solid var(--zc);transition:transform .14s ease,box-shadow .14s ease,border-left-width .14s ease;border-radius:10px;padding:.5em .75em;font-size:var(--fs,14px);line-height:1.35;cursor:pointer}
.xcard:hover,.xcard:focus-visible{background:var(--surface-2);transform:translate(-50%,-50%) scale(1.04);border-left-width:11px;box-shadow:0 8px 22px rgba(0,0,0,.32);z-index:3}
.chip.dragging,.xcard.dragging{transition:none;transform:translate(-50%,-50%) scale(1.1);z-index:20;cursor:grabbing;box-shadow:0 14px 32px rgba(0,0,0,.4)}
.chip,.xcard{cursor:grab}
.xcard .xt{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xcard .xd{display:block;color:var(--muted);margin-top:.15em}
.xcard .xd span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
.vlist{list-style:none;margin:14px 0 0;padding:0}
.vlist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.vlist .vinfo{flex:1;min-width:0}
.vlist .vname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vlist .vmeta{color:var(--muted);font-size:13px}
.vrow{display:flex;gap:8px;flex-wrap:wrap}
.vrow input{flex:1;min-width:160px;background:var(--field);border:1px solid var(--field-line);border-radius:8px;padding:8px 10px}
.section-label{font-weight:600;margin:22px 0 4px}
.muted{color:var(--muted);font-size:13px;margin:4px 0 10px}

/* Panel */
.intro{padding:16px 18px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.intro p{margin:0}
.zsec{padding:14px 18px;border-bottom:1px solid var(--line)}
.zsec:last-child{border-bottom:0}
.zrow{display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
.zlabel{flex:1;min-width:0;background:none;border:0;border-bottom:1px dashed var(--field-line);font-weight:600;padding:2px 0}
.zlabel:hover,.zlabel:focus{border-bottom-color:var(--hover-line);outline:none}
.zcount{color:var(--muted);font-size:13px}
.addbtn{background:none;border:1px solid var(--field-line);border-radius:6px;padding:4px 10px;min-height:32px;font-size:13px;cursor:pointer;color:var(--text)}
.addbtn:hover{color:var(--text);border-color:var(--hover-line)}
.zhint{color:var(--muted);font-size:13px;margin:6px 0 0}
.citem{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-left:5px solid var(--zc);border-radius:10px;padding:13px 15px;margin-top:10px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-left-width .16s ease}
.citem:hover,.citem:focus-visible{transform:translateY(-2px) scale(1.015);border-color:var(--hover-line);border-left:10px solid var(--zc);box-shadow:0 8px 22px rgba(0,0,0,.28)}
.ctitle{font-size:15.5px}
.ctitle{font-weight:500}
.ctitle.untitled{color:var(--muted);font-style:italic;font-weight:400}
.cprev{color:var(--muted);font-size:14px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:30;background:var(--backdrop);display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.overlay.open{display:flex}
.sheet{width:min(660px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head select{background:var(--surface-2);border:1px solid var(--field-line);min-height:36px;border-radius:8px;padding:6px 10px}
.sheet-head .spacer{flex:1}
.close{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.close:hover{color:var(--text)}
.ctitle-in{width:100%;background:none;border:0;border-bottom:1px solid var(--field-line);font-size:21px;font-weight:600;padding:6px 0;margin-bottom:14px}
.ctitle-in:focus{outline:none;border-bottom-color:var(--impact)}
textarea{width:100%;min-height:240px;background:var(--field);border:1px solid var(--field-line);border-radius:10px;padding:12px 14px;line-height:1.65;resize:vertical}
textarea:focus{outline:none;border-color:var(--hover-line)}
.meta{color:var(--muted);font-size:13px;margin-top:6px}
.srclabel{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
textarea.srcfield{min-height:96px;font-size:14px;line-height:1.55}
.srchelp{color:var(--muted);font-size:13px;margin:6px 0 0}
.csrc{color:var(--muted);font-size:13px;margin-top:4px}
.claude-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.result{margin-top:14px;background:var(--chip-bg);border:1px solid var(--line);border-left:3px solid var(--impact);border-radius:10px;padding:14px 16px;display:none}
.result.show{display:block}
.result h4{margin:0 0 8px;font-size:14px;color:var(--impact)}
.result .text{white-space:pre-wrap}
.result ul{margin:6px 0 0;padding-left:18px}
.result li{margin-bottom:6px}
.result .q{color:var(--muted)}
.result .row{display:flex;gap:8px;margin-top:12px}
.sheet-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;display:none}
.toast.show{display:block}
.exportbox{min-height:320px;font-size:13px}

@media (prefers-reduced-motion: reduce){ .ring,.citem,.chip,.xcard{transition:none} html{scroll-behavior:auto} }

.saved-at{color:var(--muted);font-size:13px}
.tools{display:flex;align-items:center;gap:8px}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:16px;line-height:1;padding:0}
.iconbtn:hover{border-color:var(--hover-line)}
.timer{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer:hover{border-color:var(--hover-line)}
.timer b{color:var(--text);font-weight:600}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;transition:background .3s}
.tdot.w{background:var(--impact)}
.tdot.t{background:var(--audience)}
.tdot.p{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.tstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px}
.tstat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.tstat .k{color:var(--muted);font-size:13px}
.tstat .v{font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tstat .s{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ttable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin-top:6px}
.ttable th,.ttable td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.ttable th{color:var(--muted);font-weight:500;font-size:13px}
.ttable .n{text-align:right}
.tnow{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px}
.help h3{font-size:15px;margin:22px 0 4px}
.help h3:first-of-type{margin-top:6px}
.help dl{margin:0}
.help dt{font-weight:600;margin-top:12px;font-size:14px}
.help dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.help .zdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
@media (max-width:600px){ .tools{width:100%} .timer{flex:1;justify-content:center} }
.filegrid{display:grid;gap:10px;margin-top:6px}
.filecard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.filecard h3{margin:0 0 4px;font-size:15px}
.filecard p{margin:0 0 10px;color:var(--muted);font-size:13px}
.filecard .vrow{margin-top:4px}
.importmsg{margin:10px 0 0;font-size:14px}
.importmsg:empty{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:2px 0 10px}
.segbtn{background:none;border:0;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.segbtn+.segbtn{border-left:1px solid var(--line)}
.segbtn[aria-pressed="true"]{background:var(--impact);color:var(--on-impact);font-weight:600}
.imgprev{border:1px solid var(--line);border-radius:10px;padding:10px;background-color:#ffffff;background-image:linear-gradient(45deg,#ececec 25%,transparent 25%),linear-gradient(-45deg,#ececec 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ececec 75%),linear-gradient(-45deg,transparent 75%,#ececec 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.imgprev.dark{background-color:#1b1b1b;background-image:linear-gradient(45deg,#262626 25%,transparent 25%),linear-gradient(-45deg,#262626 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#262626 75%),linear-gradient(-45deg,transparent 75%,#262626 75%)}
.imgprev img{display:block;width:100%;height:auto;max-height:360px;object-fit:contain}
</style>
</head>
<body>
<div class="bgdeco" aria-hidden="true">
  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <circle cx="90" cy="120" r="230" stroke="var(--audience)" stroke-opacity=".22"/>
    <circle cx="300" cy="40" r="200" stroke="var(--product)" stroke-opacity=".18"/>
    <circle cx="200" cy="300" r="170" stroke="var(--process)" stroke-opacity=".16"/>
    <circle cx="1500" cy="880" r="260" stroke="var(--process)" stroke-opacity=".2"/>
    <circle cx="1300" cy="980" r="210" stroke="var(--audience)" stroke-opacity=".16"/>
    <circle cx="1420" cy="680" r="150" stroke="var(--impact)" stroke-opacity=".16"/>
    <circle cx="60" cy="930" r="120" stroke="var(--product)" stroke-opacity=".14"/>
  </svg>
</div>
<header class="top glass">
  <input class="title" id="title" aria-label="Project title" value="My graduation project">
  <span class="status" id="status">Loading</span>
  <div class="actions">
    <button class="btn primary" id="saveBtn" title="Save now (Ctrl or Cmd + S). The board also saves automatically.">Save</button>
    <button class="btn" id="versionsBtn" title="Save named snapshots of your board and restore older ones">Versions</button>
    <button class="btn" id="filesBtn" title="Export to Word, import from Word, and full backups">Export / import</button>
    <button class="btn" id="claudeBtn" title="Copy a prompt that checks your whole diagram against the Context Quest ILOs">Claude ILO Check</button>
  </div>
  <div class="tools">
    <button class="timer" id="timerBtn" title="Time spent writing and thinking today. Tap for details."><span class="tdot" id="tDot"></span><span><b id="tWrite">0m</b> writing</span><span><b id="tThink">0m</b> thinking</span></button>
    <button class="iconbtn" id="themeBtn" aria-label="Switch to light mode" title="Switch between light and dark mode"></button>
    <button class="iconbtn" id="helpBtn" aria-label="Help" title="Help: what every button does">?</button>
  </div>
</header>

<main class="app">
  <div class="canvas" id="canvas" tabindex="0" role="region" aria-label="Venn diagram. Scroll or pinch to zoom, drag to move around, or use the zoom buttons and arrow keys.">
    <div class="stage" id="stage">
      <svg id="svg" viewBox="0 0 1000 1000" aria-hidden="true">
        <circle class="ring" id="ringA" stroke="var(--audience)" fill="var(--audience)"></circle>
        <circle class="ring" id="ringP" stroke="var(--product)" fill="var(--product)"></circle>
        <circle class="ring" id="ringR" stroke="var(--process)" fill="var(--process)"></circle>
      </svg>
      <div class="overlay-layer" id="layer"></div>
    </div>
    <div class="zoombar glass" role="toolbar" aria-label="Diagram zoom">
      <button class="iconbtn" id="zoomOut" aria-label="Zoom out" title="Zoom out (minus key)">&minus;</button>
      <span class="zlevel" id="zoomLevel" aria-live="polite">100%</span>
      <button class="iconbtn" id="zoomIn" aria-label="Zoom in" title="Zoom in (plus key). Zoom in to see card descriptions.">+</button>
      <button class="btn" id="zoomFit" title="Show the whole diagram again (0 key)">Fit</button>
      <span class="zhint">Scroll to zoom, drag to move</span>
    </div>
  </div>
  <aside class="panel glass" id="panel" aria-label="Cards by zone"></aside>
</main>

<div class="overlay" id="cardOverlay" role="dialog" aria-modal="true" aria-label="Edit card">
  <div class="sheet">
    <div class="sheet-head">
      <select id="zoneSel" aria-label="Zone" title="Move this card to another part of the diagram"></select>
      <span class="spacer"></span>
      <button class="close" id="closeCard" aria-label="Close">&times;</button>
    </div>
    <input class="ctitle-in" id="cTitle" placeholder="Card title" aria-label="Card title">
    <textarea id="cBody" placeholder="Write your context here in your own words." aria-label="Card text"></textarea>
    <label class="srclabel" for="cSources">Sources (APA 7)</label>
    <textarea id="cSources" class="srcfield" placeholder="One reference per line. Put titles or journal names between *asterisks* to make them italic, for example: Clark, L., &amp; Zack, M. (2023). Engineered highs. *Addictive Behaviors, 140*, 107626." aria-describedby="srcHelp"></textarea>
    <p class="srchelp" id="srcHelp">One reference per line. *Text between asterisks* becomes italic in the Word export, which also builds an alphabetical reference list.</p>
    <div class="meta" id="cMeta"></div>
    <div class="claude-row">
      <button class="btn" id="tightenBtn" title="Copy a prompt asking Claude to make your own text more concise, without adding anything">Copy tighten prompt</button>
      <button class="btn" id="gapsBtn" title="Copy a prompt asking Claude what this card is missing for its ILO, as questions">Copy gap check prompt</button>
    </div>
    <div class="result" id="result"></div>
    <div class="sheet-foot">
      <button class="btn danger" id="deleteCard" title="Delete this card. Tap twice to confirm.">Delete card</button>
      <button class="btn primary" id="doneCard">Done</button>
    </div>
  </div>
</div>

<div class="overlay" id="sideOverlay" role="dialog" aria-modal="true" aria-labelledby="sideTitle">
  <div class="sheet">
    <div class="sheet-head">
      <strong id="sideTitle">Panel</strong>
      <span class="spacer"></span>
      <button class="close" id="closeSide" aria-label="Close">&times;</button>
    </div>
    <div id="sideBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const KEY = 'venn-board-v1';
  const VKEY = 'venn-board-versions-v1';
  const ZONES = {
    audience:{label:'Audience', c:['A'], color:'var(--audience)', hint:'Who exactly this is for, and how responses may differ across cultures, ages or countries.', ilo:'ILO 3.10: specific target audience; effects may vary across cultural or international audiences.'},
    product:{label:'Product / concept', c:['P'], color:'var(--product)', hint:'The media product and how it responds to the key issue.', ilo:'ILO 3.13: a clear, relevant key issue within a complex context, and how the product addresses it.'},
    process:{label:'Process', c:['R'], color:'var(--process)', hint:'How the project is researched and made: methods, sources, steps.', ilo:'ILO 3.13 and 3.02: how aspects are investigated, and how stakeholders are involved through participatory methods.'},
    ar:{label:'Stakeholders', c:['A','R'], color:'var(--overlap)', hint:'Who is involved and why, how they take part, and how their feedback changes the project.', ilo:'ILO 3.02: diverse and intentional stakeholder selection; active participation; feedback collected and applied iteratively, with concrete changes shown.'},
    ap:{label:'Relevance', c:['A','P'], color:'var(--overlap)', hint:'Why the issue matters, for whom, and to what degree.', ilo:'ILO 3.13: critical insight into why the issue matters and its complexity; interdisciplinary and international perspectives.'},
    pr:{label:'Quality', c:['P','R'], color:'var(--overlap)', hint:'Evidence for the choices you made and the aspects you focus on.', ilo:'ILO 3.13: aspects to address are justified with well reasoned, evidence based arguments linked to project goals.'},
    impact:{label:'Impact', c:['A','P','R'], color:'var(--impact)', hint:'The specific effect you expect, on whom, and how you would observe or measure it.', ilo:'ILO 3.10: specific, plausible, measurable or observable effects supported by theory, user insight or precedent; broader cultural and societal positioning.'}
  };
  const ORDER = ['audience','product','process','ar','ap','pr','impact'];
  const CIRC = {
    A:{dir:[-0.8660254,-0.5], color:'var(--audience)'},
    P:{dir:[0.8660254,-0.5], color:'var(--product)'},
    R:{dir:[0,1], color:'var(--process)'}
  };

  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(props)) {
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style') Object.assign(n.style, v);
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    (Array.isArray(kids) ? kids : [kids]).forEach(c => c != null && n.append(c));
    return n;
  };
  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  const clone = o => JSON.parse(JSON.stringify(o));

  // ---------- State ----------
  const empty = () => ({ v:1, title:'My graduation project', labels:{}, cards:[] });
  function normalize(s){
    const o = empty();
    if (!s || typeof s !== 'object') return o;
    if (typeof s.title === 'string') o.title = s.title;
    if (s.labels && typeof s.labels === 'object') for (const z of ORDER) if (typeof s.labels[z] === 'string' && s.labels[z].trim()) o.labels[z] = s.labels[z];
    if (Array.isArray(s.cards)) o.cards = s.cards.filter(c => c && ZONES[c.zone]).map((c, i) => ({
      id:String(c.id || uid()), zone:c.zone, title:String(c.title || ''), body:String(c.body || ''),
      created:Number(c.created) || Date.now() + i, updated:Number(c.updated) || Date.now(),
      pos:c.pos && isFinite(c.pos.x) && isFinite(c.pos.y) ? {x:+c.pos.x, y:+c.pos.y} : undefined,
      sources:Array.isArray(c.sources) ? c.sources.map(x => String(x).trim()).filter(Boolean) : []
    }));
    return o;
  }
  const label = z => (state.labels[z] || ZONES[z].label);
  let state = empty();

  // ---------- Browser storage ----------
  let saveTimer = null, dirty = false;
  const timeNow = () => new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  function setStatus(t){ $('status').textContent = t; }
  function writeLocal(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); dirty = false; return true; }
    catch(e){ return false; }
  }
  function doSave(){
    const ok = writeLocal();
    const m = ok ? 'Saved in this browser at ' + timeNow() : 'Not saved: this browser blocks storage. Download a backup';
    setStatus(m); return m;
  }
  function save(){
    dirty = true;
    setStatus('Unsaved changes');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 500);
  }
  function flush(){ if (dirty) { clearTimeout(saveTimer); doSave(); } }
  let persistAsked = false;
  function askPersist(){
    if (persistAsked) return; persistAsked = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}
  }
  function saveNow(){ askPersist(); clearTimeout(saveTimer); toast(doSave()); }
  function loadLocal(){
    try { const r = localStorage.getItem(KEY); if (r) { state = normalize(JSON.parse(r)); setStatus('Saved in this browser'); return; } } catch(e){}
    setStatus('Ready');
  }
  // Write immediately whenever the tab is hidden, closed or reloaded
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);
  // Keep other open tabs of this page in step
  window.addEventListener('storage', e => { if (e.key === KEY && e.newValue && !dirty) { try { state = normalize(JSON.parse(e.newValue)); render(); } catch(err){} } });

  // ---------- Geometry ----------
  function geometry(forceW){
    const n = {A:0,P:0,R:0};
    state.cards.forEach(c => ZONES[c.zone].c.forEach(k => n[k]++));
    const r = {}; for (const k in n) r[k] = Math.min(300, 165 + 12 * n[k]);
    const avg = (r.A + r.P + r.R) / 3, d = 0.5 * avg, C = [500, 505];
    const ctr = {};
    for (const k in CIRC) ctr[k] = [C[0] + CIRC[k].dir[0] * d, C[1] + CIRC[k].dir[1] * d];
    const along = (dir, dist) => [C[0] + dir[0] * dist, C[1] + dir[1] * dist];
    const inner = avg - d;
    const outer = d / 2 + Math.sqrt(Math.max(0, avg * avg - 0.75 * d * d));
    const mid = (inner + outer) / 2;
    const neg = v => [-v[0], -v[1]];
    const anchors = {
      audience:[ctr.A[0] + CIRC.A.dir[0] * 0.42 * r.A, ctr.A[1] + CIRC.A.dir[1] * 0.42 * r.A],
      product:[ctr.P[0] + CIRC.P.dir[0] * 0.42 * r.P, ctr.P[1] + CIRC.P.dir[1] * 0.42 * r.P],
      process:[ctr.R[0] + CIRC.R.dir[0] * 0.42 * r.R, ctr.R[1] + CIRC.R.dir[1] * 0.42 * r.R],
      ar:along(neg(CIRC.P.dir), mid),
      ap:along(neg(CIRC.R.dir), mid),
      pr:along(neg(CIRC.A.dir), mid),
      impact:C
    };
    const widths = {audience:230, product:230, process:230, ar:150, ap:150, pr:150, impact:Math.max(120, Math.min(180, inner * 1.7))};
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const k in ctr){ minX=Math.min(minX,ctr[k][0]-r[k]); maxX=Math.max(maxX,ctr[k][0]+r[k]); minY=Math.min(minY,ctr[k][1]-r[k]); maxY=Math.max(maxY,ctr[k][1]+r[k]); }
    const stageW = forceW || ($('stage') && $('stage').clientWidth) || 800;
    const narrow = stageW < 560;
    const S = narrow ? Math.max(maxX-minX, maxY-minY) + 30 : Math.max(720, Math.max(maxX-minX, maxY-minY) + 90);
    const view = [ (minX+maxX)/2 - S/2, (minY+maxY)/2 - S/2, S ];
    return {r, ctr, anchors, widths, view};
  }

  // ---------- Render ----------
  function render(){ renderDiagram(); renderPanel(); if (document.activeElement !== $('title')) { $('title').value = state.title; sizeTitle(); } }

  // Seeded randomness so each card keeps its spot between visits
  function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed){ return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const measureCtx = document.createElement('canvas').getContext('2d');
  const UI_FONT = "'Instrument Sans', system-ui, sans-serif";
  const twCache = new Map(); let twFont = '';
  function textW(text, px, weight, family){
    const f = `${weight} ${px}px ${family || UI_FONT}`, k = f + '|' + text;
    let v = twCache.get(k);
    if (v === undefined) {
      if (twFont !== f) { measureCtx.font = f; twFont = f; }
      v = measureCtx.measureText(text).width;
      if (twCache.size > 20000) twCache.clear();
      twCache.set(k, v);
    }
    return v;
  }

  const ZMASK = {}; for (const z of ORDER) ZMASK[z] = {A:ZONES[z].c.includes('A'), P:ZONES[z].c.includes('P'), R:ZONES[z].c.includes('R')};
  function inZone(z, x, y, g){
    const m = ZMASK[z], c = g.ctr, r = g.r;
    let dx = x - c.A[0], dy = y - c.A[1]; if ((dx * dx + dy * dy < r.A * r.A) !== m.A) return false;
    dx = x - c.P[0]; dy = y - c.P[1]; if ((dx * dx + dy * dy < r.P * r.P) !== m.P) return false;
    dx = x - c.R[0]; dy = y - c.R[1]; return (dx * dx + dy * dy < r.R * r.R) === m.R;
  }
  function boxInZone(z, b, g, pad){
    const hw = b.w / 2 + pad, hh = b.h / 2 + pad, x = b.x, y = b.y;
    return inZone(z, x, y, g) && inZone(z, x - hw, y - hh, g) && inZone(z, x + hw, y - hh, g) && inZone(z, x - hw, y + hh, g) && inZone(z, x + hw, y + hh, g)
      && inZone(z, x, y - hh, g) && inZone(z, x, y + hh, g) && inZone(z, x - hw, y, g) && inZone(z, x + hw, y, g);
  }
  const overlaps = (a, b, gap) => Math.abs(a.x - b.x) * 2 < a.w + b.w + gap * 2 && Math.abs(a.y - b.y) * 2 < a.h + b.h + gap * 2;
  function zoneBounds(z, g){
    let x0 = -Infinity, x1 = Infinity, y0 = -Infinity, y1 = Infinity;
    for (const k of ZONES[z].c) { x0 = Math.max(x0, g.ctr[k][0] - g.r[k]); x1 = Math.min(x1, g.ctr[k][0] + g.r[k]); y0 = Math.max(y0, g.ctr[k][1] - g.r[k]); y1 = Math.min(y1, g.ctr[k][1] + g.r[k]); }
    return {x0, x1, y0, y1};
  }

  let lastStagePx = 0;
  // Works out where every zone name and card title goes, for any width and font
  let memoKey = '';
  const layoutMemo = new Map();
  function layoutCached(stagePx, fsPx, opts){
    const key = JSON.stringify([stagePx, fsPx, Object.assign({}, opts, {anchors:opts.anchors ? 1 : 0}), state.labels, state.cards.map(c => [c.id, c.zone, c.title, opts.expand ? c.body : (c.body.trim() ? 1 : 0), c.pos || 0, c.created])]);
    if (memoKey === '__reset') { layoutMemo.clear(); memoKey = ''; }
    let v = layoutMemo.get(key);
    if (!v) { v = layout(stagePx, fsPx, opts); layoutMemo.set(key, v); if (layoutMemo.size > 12) layoutMemo.delete(layoutMemo.keys().next().value); }
    return v;
  }
  function layout(stagePx, fsPx, opts = {}){
    const family = opts.family || UI_FONT;
    const headExtra = opts.headExtra == null ? 4.2 : opts.headExtra;
    const g = geometry(opts.forceW);
    const VS = g.view[2];
    const u = VS / stagePx;
    const placed = [];
    const gap = 5 * u, edgePad = 6 * u;
    const chipH = Math.max(24, fsPx * 1.3 + fsPx * 0.64 + 2) * u;   // at least 24px tall (WCAG 2.5.8)
    const avgR = (g.r.A + g.r.P + g.r.R) / 3;
    const heads = {};
    for (const z of ORDER) {
      const [ax, ay] = g.anchors[z];
      const wPx = textW(label(z), fsPx * 1.12, 600, family) + fsPx * headExtra;
      const box = {x:ax, y:ay, w:wPx * u, h:fsPx * 1.9 * u, zone:z};
      placed.push(box); heads[z] = box;
    }
    const chips = [], hiddenBy = {};
    for (const z of ORDER) {
      const rank = c => c.pos ? 2 : (opts.anchors && opts.anchors.has(c.id) ? 1 : 0);
      const cards = state.cards.filter(c => c.zone === z).sort((a, b) => rank(b) - rank(a) || a.created - b.created);
      const bnd = zoneBounds(z, g);
      const ms = opts.maxScale || 1;
      const maxW = ms * (ZONES[z].c.length === 1 ? 0.62 * g.r[ZONES[z].c[0]] : ZONES[z].c.length === 2 ? 0.6 * avgR : 0.65 * avgR);
      hiddenBy[z] = 0;
      let fullAt = Infinity, fails = 0;   // narrowest width that already failed, and how many failed
      for (const c of cards) {
        const text = c.title.trim() || 'Untitled card';
        const fullW = (textW(text, fsPx, 500, family) + fsPx * 1.7 + 2) * u;
        // Titles that fit are shown in full or not at all; only titles longer than the zone allows get shortened
        const widths = fullW <= maxW ? [fullW] : [maxW, maxW * 0.75, maxW * 0.55];
        const tries = fullW <= maxW ? [opts.tries ? opts.tries[0] + opts.tries[1] : 420] : (opts.tries || [260, 160, 120]);
        const rand = rng(hash(c.id));
        let spot = null;
        // Zoomed in: cards can open up to show the start of their description
        let xinfo = null;
        if (opts.expand && c.body.trim()) {
          const xwPx = Math.min(maxW / u, fsPx * 17);
          const lines = wrapLines(c.body.trim(), xwPx - fsPx * 1.5 - 6, fsPx, opts.descLines || 3, family);
          if (lines.length && xwPx > fsPx * 9) xinfo = {w:xwPx * u, h:(fsPx * 1.0 + fsPx * 1.35 + fsPx * 0.15 + lines.length * fsPx * 1.35 + 2) * u, lines};
        }
        // A card you dragged stays where you put it, as long as that spot is still inside its zone
        if (c.pos) {
          const px = 500 + c.pos.x * avgR, py = 505 + c.pos.y * avgR;
          if (inZone(z, px, py, g)) {
            spot = xinfo ? {x:px, y:py, w:xinfo.w, h:xinfo.h, lines:xinfo.lines} : {x:px, y:py, w:widths[0], h:chipH};
            spot.pinned = true;
            // If it lands on a zone name or another card, use the nearest free spot around the drop point
            if (placed.some(q => overlaps(q, spot, gap))) {
              const ox = spot.x, oy = spot.y, step = Math.max(spot.h * 0.6, 4 * u);
              let found = false;
              for (let ring = 1; ring <= 40 && !found; ring++) {
                const n = 8 + ring * 4;
                for (let i = 0; i < n && !found; i++) {
                  const a = (i / n) * Math.PI * 2;
                  const cand = {x:ox + Math.cos(a) * ring * step, y:oy + Math.sin(a) * ring * step, w:spot.w, h:spot.h};
                  if (inZone(z, cand.x, cand.y, g) && boxInZone(z, cand, g, 0) && !placed.some(q => overlaps(q, cand, gap))) { spot.x = cand.x; spot.y = cand.y; found = true; }
                }
              }
              if (!found) spot = null;   // no room near there: place it automatically instead
            }
          }
        }
        // Zoomed in or out: keep the card where it was in the 100% view.
        // A card that opens up to show its description only shifts a little if it needs the room.
        const an = !spot && !c.pos && opts.anchors ? opts.anchors.get(c.id) : null;
        if (an) {
          const near = (w, h, rings) => {
            const step = Math.max(h * 0.3, 3 * u);
            for (let ring = 0; ring <= rings; ring++) {
              const n = ring === 0 ? 1 : 8 + ring * 4;
              for (let i = 0; i < n; i++) {
                const a = (i / n) * Math.PI * 2;
                const cand = {x:an.x + Math.cos(a) * ring * step, y:an.y + Math.sin(a) * ring * step, w, h};
                if (boxInZone(z, cand, g, edgePad) && !placed.some(q => overlaps(q, cand, gap))) return cand;
              }
            }
            return null;
          };
          if (xinfo) { const b = near(xinfo.w, xinfo.h, 6); if (b) { spot = b; spot.lines = xinfo.lines; } }
          if (!spot) spot = near(widths[0], chipH, 3);
        }
        if (xinfo && !spot && !an) {
          for (let i = 0; i < 500 && !spot; i++) {
            const box = {x:bnd.x0 + rand() * (bnd.x1 - bnd.x0), y:bnd.y0 + rand() * (bnd.y1 - bnd.y0), w:xinfo.w, h:xinfo.h};
            if (!boxInZone(z, box, g, edgePad)) continue;
            if (placed.some(p => overlaps(p, box, gap))) continue;
            spot = box; spot.lines = xinfo.lines;
          }
        }
        if (!spot && fails >= 2 && widths[widths.length - 1] >= fullAt) { hiddenBy[z]++; continue; }
        for (let wi = 0; wi < widths.length && !spot; wi++) {
          for (let i = 0; i < tries[wi] && !spot; i++) {
            const box = {x:bnd.x0 + rand() * (bnd.x1 - bnd.x0), y:bnd.y0 + rand() * (bnd.y1 - bnd.y0), w:widths[wi], h:chipH};
            if (!boxInZone(z, box, g, edgePad)) continue;
            if (placed.some(p => overlaps(p, box, gap))) continue;
            spot = box;
          }
        }
        if (!spot) { hiddenBy[z]++; fails++; fullAt = Math.min(fullAt, widths[widths.length - 1]); continue; }
        fails = 0;
        placed.push(spot);
        chips.push(Object.assign(spot, {zone:z, id:c.id, text, untitled:!c.title.trim()}));
      }
    }
    return {g, u, chips, heads, hiddenBy};
  }

  const wlCache = new Map();
  function wrapLines(text, maxPx, fs, maxLines, family){
    const key = [text, Math.round(maxPx), fs, maxLines, family].join('|');
    const hit = wlCache.get(key); if (hit) return hit.slice();
    const res = wrapLinesRaw(text, maxPx, fs, maxLines, family);
    if (wlCache.size > 2000) wlCache.clear();
    wlCache.set(key, res); return res.slice();
  }
  function wrapLinesRaw(text, maxPx, fs, maxLines, family){
    const out = [];
    const words = text.replace(/\s+/g, ' ').split(' ');
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (textW(test, fs, 400, family) <= maxPx) { line = test; continue; }
      if (line) out.push(line);
      line = words[i];
      if (out.length === maxLines) break;
    }
    if (out.length < maxLines && line) out.push(line);
    const used = out.join(' ').length;
    if (out.length > maxLines || used < text.replace(/\s+/g, ' ').length) {
      out.length = Math.min(out.length, maxLines);
      const last = out[out.length - 1] || '';
      let cut = last;
      while (cut && textW(cut + '\u2026', fs, 400, family) > maxPx) cut = cut.slice(0, -1);
      out[out.length - 1] = cut.trimEnd() + '\u2026';
    }
    return out;
  }

  // ---------- Zoom ----------
  let Z = 1, panX = 0, panY = 0, lastG = null, lastView = null, lastRenderedL = null, lastRenderedSig = '', viewTouched = false;
  const ZMIN = 0.6, ZMAX = 4, EXPAND_AT = 1.6;
  const isDesktop = () => window.matchMedia('(min-width: 921px)').matches;
  // The part of the canvas that is not covered by the top bar, card panel or zoom bar
  function safeRect(){
    const c = $('canvas').getBoundingClientRect();
    let l = c.left, t = c.top, r = c.right, b = c.bottom;
    if (isDesktop()) {
      t = Math.max(t, document.querySelector('header.top').getBoundingClientRect().bottom + 8);
      r = Math.min(r, $('panel').getBoundingClientRect().left - 8);
      b = b - 30;
    } else { b = b - 40; }
    return {l, t, r, b, w:Math.max(160, r - l), h:Math.max(160, b - t), c};
  }
  let baseCache = 0;
  const baseW = () => baseCache || (baseCache = Math.max(220, Math.round(Math.min(safeRect().w, safeRect().h) * 1.02)));
  function applyPan(){ $('stage').style.transform = `translate3d(${panX}px, ${panY}px, 0)`; }
  let panFrame = 0;
  function schedulePan(){ if (!panFrame) panFrame = requestAnimationFrame(() => { panFrame = 0; applyPan(); }); }
  // Instant preview while zooming: scale the drawn diagram around a point, redraw properly afterwards
  function previewScale(k, cx, cy){
    const c = $('canvas').getBoundingClientRect(), ax = cx - c.left, ay = cy - c.top;
    $('stage').style.transform = `translate3d(${ax - (ax - panX) * k}px, ${ay - (ay - panY) * k}px, 0) scale(${k})`;
  }
  function clampPan(){
    const c = $('canvas').getBoundingClientRect(), S = baseW() * Z, keep = 90;
    panX = Math.min(c.width - keep, Math.max(keep - S, panX));
    panY = Math.min(c.height - keep, Math.max(keep - S, panY));
  }
  function fitView(){
    baseCache = 0;
    const s = safeRect(), base = baseW();
    Z = 1; viewTouched = false;

  function renderDiagram(){

  // ---------- Diagram image export (transparent PNG or SVG) ----------
  const EXPORT_FONT = 'Arial, Helvetica, sans-serif';
  const PALETTES = {
    light:{text:'#1a1a1a', muted:'#5a5a5a', chip:'#ffffff', A:'#13719D', P:'#41780C', R:'#6E4FD8', overlap:'#3a3a3a', impact:'#AB500D'},
    dark:{text:'#f2f2f2', muted:'#a8a8a8', chip:'#0b0b0b', A:'#3BB4E5', P:'#76BC20', R:'#B79CFF', overlap:'#e2e2e2', impact:'#EE7622'}

  function diagramSVG(theme){
    const pal = PALETTES[theme] || PALETTES.light;
    const W = 1000, fs = 15;
    const L = layout(W, fs, {family:EXPORT_FONT, headExtra:1.4, forceW:W, maxScale:1.45, tries:[700, 400, 300]});
    const g = L.g, [vx, vy, VS] = g.view, k = W / VS;
    const X = x => (x - vx) * k, Y = y => (y - vy) * k;
    // crop to the circles plus a small margin
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const c of ['A','P','R']) { x0 = Math.min(x0, X(g.ctr[c][0] - g.r[c])); x1 = Math.max(x1, X(g.ctr[c][0] + g.r[c])); y0 = Math.min(y0, Y(g.ctr[c][1] - g.r[c])); y1 = Math.max(y1, Y(g.ctr[c][1] + g.r[c])); }
    const m = 14; x0 -= m; y0 -= m; x1 += m; y1 += m;
    const w = Math.ceil(x1 - x0), h = Math.ceil(y1 - y0);
    const parts = [];
    for (const c of ['A','P','R']) parts.push(`<circle cx="${(X(g.ctr[c][0]) - x0).toFixed(1)}" cy="${(Y(g.ctr[c][1]) - y0).toFixed(1)}" r="${(g.r[c] * k).toFixed(1)}" fill="${pal[c]}" fill-opacity="0.08" stroke="${pal[c]}" stroke-width="2"/>`);
    for (const ch of L.chips) {
      const cw = ch.w * k, chh = ch.h * k, cx = X(ch.x) - x0, cy = Y(ch.y) - y0;
      const col = zoneColor(ch.zone, pal);
      const label_ = fitText(ch.text, cw - fs * 1.5, fs, 500);
      parts.push(`<rect x="${(cx - cw / 2).toFixed(1)}" y="${(cy - chh / 2).toFixed(1)}" width="${cw.toFixed(1)}" height="${chh.toFixed(1)}" rx="${(chh / 2).toFixed(1)}" fill="${pal.chip}" stroke="${col}" stroke-width="1.3"/>`);
      parts.push(`<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-family="${EXPORT_FONT}" font-size="${fs}" font-weight="500" fill="${ch.untitled ? pal.muted : pal.text}"${ch.untitled ? ' font-style="italic"' : ''}>${xmlEsc(label_)}</text>`);
    }
    for (const z of ORDER) {
      const hb = L.heads[z], hid = L.hiddenBy[z];
      const hw = textW(label(z), fs * 1.12, 700, EXPORT_FONT) + (hid ? textW(` +${hid} more`, fs * 0.85, 400, EXPORT_FONT) : 0) + fs * 1.2, hh = fs * 1.75;
      parts.push(`<rect x="${(X(hb.x) - x0 - hw / 2).toFixed(1)}" y="${(Y(hb.y) - y0 - hh / 2).toFixed(1)}" width="${hw.toFixed(1)}" height="${hh.toFixed(1)}" rx="${(hh / 2).toFixed(1)}" fill="${theme === 'dark' ? '#000000' : '#ffffff'}" fill-opacity="0.86"/>`);
      parts.push(`<text x="${(X(hb.x) - x0).toFixed(1)}" y="${(Y(hb.y) - y0).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-family="${EXPORT_FONT}" font-size="${(fs * 1.12).toFixed(1)}" font-weight="700" fill="${zoneColor(z, pal)}">${xmlEsc(label(z))}${hid ? `<tspan font-size="${(fs * 0.85).toFixed(1)}" font-weight="400" fill="${pal.muted}"> +${hid} more</tspan>` : ''}</text>`);
    }
    return {svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${parts.join('')}</svg>`, w, h, hidden:Object.values(L.hiddenBy).reduce((a, b) => a + b, 0)};
  }
  async function svgToPng(svg, w, h, scale){

    if (bookmark) { const k = bookmark.replace(/^vb_/, ''); if (ZONES[k]) return k; }
    const t = norm(text);
    for (const z of ORDER) if (t === norm(label(z)) || t === norm(ZONES[z].label) || t === z) return z;
    return null;
  }
  function parseDocx(xml){
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('bad_xml');
    const bodyEl = doc.getElementsByTagNameNS(W, 'body')[0];
    if (!bodyEl) throw new Error('bad_xml');
    const out = {title:null, labels:{}, cards:[], skipped:[]};
    let zone = null, card = null, order = Date.now(), inRefs = false;
    for (const p of bodyEl.getElementsByTagNameNS(W, 'p')) {
      const ps = p.getElementsByTagNameNS(W, 'pStyle')[0];
      const style = norm(ps ? wAttr(ps, 'val') : '');
      let text = '';
      for (const n of p.getElementsByTagNameNS(W, '*')) {
        if (n.localName === 't') text += n.textContent;
        else if (n.localName === 'tab') text += '\t';
        else if (n.localName === 'br' || n.localName === 'cr') text += '\n';
      }
      const bm = [...p.getElementsByTagNameNS(W, 'bookmarkStart')].map(b => wAttr(b, 'name')).find(n => n.startsWith('vb_'));
      if (style === 'title') { if (text.trim()) out.title = text.trim(); continue; }
      if (style === 'vbmeta' || style === 'vbsourcelabel') continue;
      if (style === 'vbsource') {
        if (card) {
          let mk = '';
          for (const r of p.getElementsByTagNameNS(W, 'r')) {
            let t = ''; for (const n of r.getElementsByTagNameNS(W, 't')) t += n.textContent;
            const it = r.getElementsByTagNameNS(W, 'i')[0];
            const italic = it && wAttr(it, 'val') !== '0' && wAttr(it, 'val') !== 'false';
            mk += italic && t.trim() ? '*' + t + '*' : t;
          }
          mk = mk.replace(/\*\*/g, '').trim();
          if (mk) card.sources.push(mk);
        }
        continue;
      }
      if (style === 'vbreference' || inRefs && !/^(heading|kop|berschrift|titre)[12]$/.test(style)) continue;
      if (/^(heading|kop|berschrift|titre)1$/.test(style)) {
        card = null;
        inRefs = bm === 'vb_references' || norm(text) === 'references';
        if (inRefs) { zone = null; continue; }
        zone = matchZone(text, bm);
        if (zone && text.trim() && norm(text) !== norm(ZONES[zone].label)) out.labels[zone] = text.trim();
        if (!zone && text.trim()) out.skipped.push(text.trim());
        continue;
      }
      if (/^(heading|kop|berschrift|titre)2$/.test(style)) {
        if (!zone) { card = null; continue; }
        card = {id:uid(), zone, title:text.trim(), lines:[], sources:[], created:order++, updated:Date.now()};
        out.cards.push(card); continue;
      }
      if (card) card.lines.push(text);
    }
    out.cards = out.cards.map(c => { const lines = c.lines.slice(); while (lines.length && !lines[0].trim()) lines.shift(); while (lines.length && !lines[lines.length - 1].trim()) lines.pop(); return {id:c.id, zone:c.zone, title:c.title, body:lines.join('\n'), sources:c.sources || [], created:c.created, updated:c.updated}; });
    return out;
  }
  async function readDocxFile(file){
    const buf = await file.arrayBuffer();
    const xml = await readZipEntry(buf, 'word/document.xml');
    return parseDocx(xml);
  }

  // ---------- JSON backup ----------
  function downloadBackup(){
    flush();
    const data = JSON.stringify({app:'venn-board', exported:new Date().toISOString(), board:state, versions, time:tlog}, null, 2);
    downloadBlob(new Blob([data], {type:'application/json'}), slug(state.title) + '-backup-' + today() + '.json');
    toast('Backup downloaded');
  }
  async function readBackupFile(file){
    const parsed = JSON.parse(await file.text());
    const board = normalize(parsed && parsed.board ? parsed.board : parsed);
    const vers = parsed && Array.isArray(parsed.versions) ? parsed.versions.filter(v => v && v.state) : [];
    const time = parsed && parsed.time && parsed.time.days ? parsed.time : null;
    return {board, versions:vers, time};
  }

  // ---------- Versions ----------
  let versions = [];
  function loadVersions(){ try { const r = localStorage.getItem(VKEY); versions = r ? JSON.parse(r) : []; } catch(e){ versions = []; } if (!Array.isArray(versions)) versions = []; }
  function storeVersions(){
    if (versions.length > 30) versions.length = 30;

      catch(e){ if (versions.length <= 1) return false; versions.pop(); }
    }

  function snapshot(name){ return {id:uid(), name:(name || '').trim() || 'Version ' + (versions.length + 1), at:Date.now(), cards:state.cards.length, state:clone(state)}; }
  function addVersion(name){ flush(); versions.unshift(snapshot(name)); toast(storeVersions() ? 'Version saved' : 'Browser storage is full. Download a backup instead'); }
  function replaceBoard(next, versionName){
    versions.unshift(snapshot(versionName)); storeVersions();
    state = normalize(next); render(); doSave();
  }

      ]));

    openSide('Versions', [
      el('p', {class:'muted', style:{marginTop:0}, text:'Your board saves automatically in this browser. A version is a snapshot you can return to later.'}),

  }

  // ---------- Export / import sheet ----------
  function openFiles(){
    const docIn = el('input', {type:'file', accept:'.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document', style:{display:'none'}});

    openSide('Export / import', [
      el('div', {class:'filegrid'}, [

          themeBtns, preview, imgNote,
          el('div', {class:'vrow', style:{marginTop:'10px'}}, [pngBtn, svgBtn])
        ]),

        ]),

  // ---------- Misc ----------
  let toastT = null;

  function sizeTitle(){ const t = $('title'); t.size = Math.max(12, Math.min(60, (t.value || t.placeholder || '').length + 1)); }
  $('title').addEventListener('input', e => { state.title = e.target.value; sizeTitle(); save(); });
  $('saveBtn').addEventListener('click', saveNow);
  $('versionsBtn').addEventListener('click', openVersions);
  $('filesBtn').addEventListener('click', openFiles);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(); return; }
    if (e.key !== 'Escape') return;
    if ($('cardOverlay').classList.contains('open')) closeCard();
    else if ($('sideOverlay').classList.contains('open')) closeSide();
  });

  // ---------- Time tracker: writing vs thinking ----------
  const TKEY = 'venn-board-time-v1';
  const WRITE_WINDOW = 8000;          // typing in the last 8 s counts as writing
  const IDLE_LIMIT = 5 * 60 * 1000;   // nothing at all for 5 min stops the clock
  let tlog = {days:{}, paused:false};
  try { const r = localStorage.getItem(TKEY); if (r) { const p = JSON.parse(r); if (p && p.days) tlog = {days:p.days, paused:!!p.paused}; } } catch(e){}
  const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function storeTime(){ try { localStorage.setItem(TKEY, JSON.stringify(tlog)); } catch(e){} }
  function mergeTime(other){
    for (const [d, v] of Object.entries(other.days || {})) {
      const cur = tlog.days[d] || {w:0, t:0};
      tlog.days[d] = {w:Math.max(cur.w || 0, Number(v.w) || 0), t:Math.max(cur.t || 0, Number(v.t) || 0)};
    }
    storeTime(); updateTimer();
  }
  function fmt(sec){
    const m = Math.floor((sec || 0) / 60);
    if (m === 0) return sec >= 1 ? '<1m' : '0m';
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  }
  let lastType = 0, lastAct = Date.now(), lastTick = Date.now(), tMode = null, sinceStore = 0;
  document.addEventListener('input', e => { const t = e.target; if (t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement) { if (t.type === 'file') return; lastType = lastAct = Date.now(); } }, true);
  for (const ev of ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart', 'scroll']) document.addEventListener(ev, () => { lastAct = Date.now(); }, {passive:true, capture:true});
  document.addEventListener('visibilitychange', () => { lastTick = Date.now(); if (document.visibilityState === 'visible') lastAct = Date.now(); else storeTime(); });
  function sum(keys){ let w = 0, t = 0; for (const k of keys) { const d = tlog.days[k]; if (d) { w += d.w || 0; t += d.t || 0; } } return {w, t}; }
  function lastNDays(n){ const out = []; const d = new Date(); for (let i = 0; i < n; i++) { out.push(dayKey(d)); d.setDate(d.getDate() - 1); } return out; }
  function updateTimer(){
    const today = tlog.days[dayKey()] || {w:0, t:0};
    $('tWrite').textContent = fmt(today.w);
    $('tThink').textContent = fmt(today.t);
    $('tDot').className = 'tdot' + (tlog.paused ? ' p' : tMode === 'w' ? ' w' : tMode === 't' ? ' t' : '');
    $('timerBtn').title = tlog.paused ? 'Timer paused. Tap to resume or see details.' : 'Time spent writing and thinking today. Tap for details.';
    $('timerBtn').setAttribute('aria-label', `Time tracker${tlog.paused ? ', paused' : ''}. Today ${fmt(today.w)} writing and ${fmt(today.t)} thinking. Open details.`);
  }
  setInterval(() => {
    const now = Date.now();
    const dt = Math.min(5, Math.max(0, (now - lastTick) / 1000));
    lastTick = now;
    tMode = null;
    if (!tlog.paused && document.visibilityState === 'visible') {
      if (now - lastType < WRITE_WINDOW) tMode = 'w';
      else if (now - lastAct < IDLE_LIMIT) tMode = 't';
      if (tMode) {
        const k = dayKey();
        const rec = tlog.days[k] || (tlog.days[k] = {w:0, t:0});
        rec[tMode] = (rec[tMode] || 0) + dt;
        sinceStore += dt;
        if (sinceStore >= 15) { sinceStore = 0; storeTime(); }
      }
    }
    updateTimer();
    if ($('sideOverlay').classList.contains('open') && $('sideTitle').textContent === 'Time tracker') refreshTimerSheet();
  }, 1000);
  window.addEventListener('pagehide', storeTime);

  let timerSheetNodes = null, resetArmed = 0;
  function timeLogText(){
    const days = Object.keys(tlog.days).sort();
    const lines = ['Time log: ' + (state.title || 'Venn board'), ''];
    for (const d of days) { const v = tlog.days[d]; lines.push(`${d}  writing ${fmt(v.w)}, thinking ${fmt(v.t)}, total ${fmt((v.w || 0) + (v.t || 0))}`); }
    const all = sum(days);
    lines.push('', `All time: writing ${fmt(all.w)}, thinking ${fmt(all.t)}, total ${fmt(all.w + all.t)}`);
    return lines.join('\n');
  }
  function statBox(k, v){ return el('div', {class:'tstat'}, [el('div', {class:'k', text:k}), el('div', {class:'v', text:fmt(v.w + v.t)}), el('div', {class:'s', text:fmt(v.w) + ' writing, ' + fmt(v.t) + ' thinking'})]); }
  function refreshTimerSheet(){
    if (!timerSheetNodes) return;
    const {stats, table, now, pauseBtn} = timerSheetNodes;
    stats.replaceChildren(statBox('Today', sum([dayKey()])), statBox('Last 7 days', sum(lastNDays(7))), statBox('All time', sum(Object.keys(tlog.days))));
    const rows = Object.keys(tlog.days).sort().reverse().slice(0, 14);
    table.replaceChildren(
      el('thead', {}, el('tr', {}, [el('th', {text:'Day'}), el('th', {class:'n', text:'Writing'}), el('th', {class:'n', text:'Thinking'}), el('th', {class:'n', text:'Total'})])),
      el('tbody', {}, rows.length ? rows.map(d => { const v = tlog.days[d]; return el('tr', {}, [el('td', {text:new Date(d + 'T12:00').toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'})}), el('td', {class:'n', text:fmt(v.w)}), el('td', {class:'n', text:fmt(v.t)}), el('td', {class:'n', text:fmt((v.w || 0) + (v.t || 0))})]); }) : [el('tr', {}, el('td', {colspan:'4', class:'muted', text:'No time recorded yet.'}))])
    );
    now.replaceChildren(el('span', {class:$('tDot').className}), el('span', {text:tlog.paused ? 'Paused' : tMode === 'w' ? 'Counting writing time' : tMode === 't' ? 'Counting thinking time' : 'Not counting: no activity for 5 minutes'}));
    pauseBtn.textContent = tlog.paused ? 'Resume timer' : 'Pause timer';
  }
  function openTimer(){
    const stats = el('div', {class:'tstats'});
    const table = el('table', {class:'ttable'});
    const now = el('p', {class:'tnow'});
    const pauseBtn = el('button', {class:'btn', onclick:() => { tlog.paused = !tlog.paused; storeTime(); updateTimer(); refreshTimerSheet(); toast(tlog.paused ? 'Timer paused' : 'Timer running'); }});
    const resetBtn = el('button', {class:'btn danger', text:'Reset all time', onclick:() => {
      if (Date.now() - resetArmed > 3000) { resetArmed = Date.now(); resetBtn.textContent = 'Tap again to reset'; setTimeout(() => { if (Date.now() - resetArmed >= 3000) resetBtn.textContent = 'Reset all time'; }, 3100); return; }
      resetArmed = 0; tlog.days = {}; storeTime(); updateTimer(); refreshTimerSheet(); resetBtn.textContent = 'Reset all time'; toast('Time reset');
    }});
    timerSheetNodes = {stats, table, now, pauseBtn};
    openSide('Time tracker', [
      now, stats,
      el('div', {class:'section-label', text:'Per day'}), table,
      el('div', {class:'vrow', style:{marginTop:'16px'}}, [pauseBtn, el('button', {class:'btn', text:'Copy time log', onclick:() => copyText(timeLogText(), 'Time log copied')}), resetBtn]),
      el('p', {class:'muted', style:{marginTop:'16px'}, text:'Writing counts while you type, plus 8 seconds after your last keystroke. Thinking counts while the page is open in front of you and you are reading, scrolling or moving around without typing. The clock stops after 5 minutes with no activity, and whenever the tab is in the background. Time is included in your full backup.'})
    ]);
    refreshTimerSheet();
  }
  $('timerBtn').addEventListener('click', openTimer);

  // ---------- Light / dark mode ----------
  const ICON_SUN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  function openHelp(){

      el('dt', {}, [el('span', {class:'zdot', style:{background:ZONES[z].color}}), document.createTextNode(label(z))]),
      el('dd', {text:ZONES[z].hint})
    ]));
    openSide('Help', [el('div', {class:'help'}, [
      el('h3', {text:'Top bar'}),
      el('dl', {}, [
        ...helpItem('Project title', 'Tap the title to rename your project. It is used as the title of your Word export.'),
        ...helpItem('Save', 'Saves right away and shows the time. Your board also saves on its own while you type and when you close the tab. Shortcut: Ctrl or Cmd + S.'),
        ...helpItem('Versions', 'Save a named snapshot, for example "Week 6 after interviews", and restore it later. Before every restore or import, your current board is kept as a version, so nothing is lost.'),
        ...helpItem('Export / import', 'Diagram image downloads the Venn diagram as a transparent PNG or SVG to place in Word, with dark text for white pages or light text for dark slides. Export as Word turns each zone into a Heading 1 and each card into a Heading 2 with its text below. Import from Word reads that structure back in, including edits you made in Word. Download backup saves an exact copy of your board, versions and time log as a .json file. Load backup brings it back on any device.'),
        ...helpItem('Claude ILO Check', 'Copies a prompt that asks Claude to check your whole diagram against ILOs 3.13, 3.10 and 3.02. Paste it into claude.ai. It also lets you copy the diagram as plain text.'),
        ...helpItem('Timer', 'Shows how long you spent writing and thinking today. Orange dot: writing. Blue dot: thinking. Grey dot: not counting. Tap it for daily totals, pause, reset, and a time log you can copy into your iLog.'),
        ...helpItem('Light / dark', 'Switches between light and dark mode. Your choice is remembered.'),
        ...helpItem('?', 'Opens this help.')
      ]),
      el('h3', {text:'Diagram'}),
      el('dl', {}, [
        ...helpItem('Zone name with +', 'Tap a zone name to add a card to that part of the diagram. The number shows how many cards it holds.'),
        ...helpItem('Card titles', 'Each card appears inside its own zone. Tap a title to open the card. Circles grow as you add cards.'),
        ...helpItem('+2 next to a zone name', 'Some cards did not fit in the diagram. Tap it to jump to them in the list.'),
        ...helpItem('Zoom and move', 'Scroll or pinch to zoom, double-click an empty spot, or use the + and \u2212 buttons and keys. Drag the background to move around, or use the arrow keys when the diagram is selected. From 160% the cards open up to show the start of their description, and from 260% they show more. Fit, or the 0 key, shows the whole diagram again.'),
        ...helpItem('Drag a card', 'Drag a card to place it exactly where you want it. Drop it in another zone to move it there. You can also move a card with the zone menu inside the card.')
      ]),
      el('h3', {text:'Card list'}),
      el('dl', {}, [
        ...helpItem('Zone names', 'Tap a zone name in the list to rename it. The new name shows up in the diagram and in your Word export.'),
        ...helpItem('Add card', 'Adds a card to that zone and opens it.'),
        ...helpItem('A card', 'Tap to open it. The coloured edge shows which zone it belongs to.')
      ]),
      el('h3', {text:'Inside a card'}),
      el('dl', {}, [
        ...helpItem('Zone menu', 'Moves the card to another part of the diagram.'),
        ...helpItem('Copy tighten prompt', 'Copies a prompt asking Claude to make your own text more concise. It adds no new facts and keeps your citations. Paste the result back if you like it.'),
        ...helpItem('Sources (APA 7)', 'Add the references a card relies on, one per line. Put titles or journal names between *asterisks* to make them italic. The Word export lists them under each card and builds an alphabetical References list at the end, without duplicates.'),
        ...helpItem('Copy gap check prompt', 'Copies a prompt asking Claude what this card is missing for its ILO. You get questions to answer in your own words, not new text.'),
        ...helpItem('Delete card', 'Tap twice to delete. Empty cards are removed on their own when you close them.'),
        ...helpItem('Done', 'Closes the card. Everything is already saved. Esc also closes it.')
      ]),
      el('h3', {text:'What the zones mean'}),
      zoneList,
      el('h3', {text:'Where your data lives'}),
      el('p', {class:'muted', style:{margin:'4px 0 0'}, text:'Everything stays in this browser on this device. It survives closing the browser and restarting, but not clearing your browsing data or using a private window. Download a backup now and then.'})
    ])]);
  }
  $('helpBtn').addEventListener('click', openHelp);
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement || t instanceof HTMLSelectElement) return;
    if (e.key === '?' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); openHelp(); }
  });

  loadLocal();
  loadVersions();
  fitView();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { twCache.clear(); wlCache.clear(); memoKey = '__reset'; lastRenderedL = null; renderDiagram(); });
  sizeTitle();
  updateTimer();
})();
</script>
</body>
</html>
